<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula03 - HTML</title>
  </head>
  <body>

    <h1>Atributos em elementos no HTML</h1>

    <p>Exemplo de atributo href: </p>

    <a href="https://www.w3schools.com">Clique aqui</a>

    <hr>

    <p>Exemplo de atributos src, width, height e alt: </p>

    <img src="carro-de-corrida.avif" width="250" height="145" alt="Carro de Fórmula 1 da Equipe Red Bull Racing">

    <hr>

    <p>Exemplo do atributo style:</p>

    <p style="color: orangered;">Esse texto não é rosa</p>

  </body>
</html>
